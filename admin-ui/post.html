<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글 편집 · taerim.page 관리자</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="/assets/theme.js"></script>
  <!-- 수식 미리보기용 (build:admin이 복사, 글꼴은 쓰는 것만 받음) -->
  <link rel="stylesheet" href="/assets/katex/katex.min.css">
  <script type="module" src="/assets/post.js"></script>
  <script type="module" src="/assets/deploy.js"></script>
</head>
<body class="editor-body">
  <!--
    새 글(/posts/new)과 편집(/posts/edit/:id)이 같이 쓰는 화면.
    칸 아래의 [data-count-for]·[data-error-for]는 post.js가 칸 이름으로 찾아서 글자 수·오류를 채운다.
  -->
  <header class="topbar">
    <!-- 머리글 (설계 16-11): 모든 관리자 화면이 같은 모양. 배포 상태·버튼은 deploy.js, 다크 버튼은 theme.js -->
    <div class="topbar-inner">
      <a class="brand" href="/">taerim.page <span class="brand-sub">admin</span></a>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <a href="/" aria-current="page">글</a>
        <a href="/activities">활동</a>
        <a href="/tags">태그</a>
        <a href="/images">이미지</a>
        <a href="/trash">휴지통</a>
        <a href="/settings">설정</a>
      </nav>
      <div class="topbar-tools">
        <span id="deploy-status" class="muted deploy-status"></span>
        <button id="deploy-button" class="button deploy-button" type="button" disabled title="공개 사이트에 반영해요 (GitHub Actions)">배포</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드" title="다크 모드"></button>
      </div>
    </div>
  </header>

  <main class="editor-page">
    <p id="loading" class="muted">불러오는 중…</p>

    <div id="editor" hidden>
      <!-- 편집 화면 (설계 16-12·16-13, 시안 E-2·E-8): 메인은 제목·본문·미리보기. 대표 이미지·소개글·태그는 아래 [글 정보] 팝업 -->
      <div class="editor-status">
        <span id="status-pill" class="pill"></span>
        <span id="dirty-mark" class="dirty" hidden>저장 안 됨</span>
        <span id="saved-at" class="muted"></span>
        <!-- 번역: 번역 화면으로 가는 버튼 + 상태 (저장한 글에만) -->
        <a id="translation-link" class="button" hidden>English</a>
        <span id="translation-badge"></span>
      </div>
      <p id="state-help" class="state-help" hidden></p>

      <div class="editor-grid with-card">
        <!-- 왼쪽: 쓰기 = 흰 카드 하나 (제목 → 도구 줄 → 본문), 설계 16-13 -->
        <section class="write" aria-label="쓰기">
          <div class="write-card">
            <input id="title" class="title-input" type="text" placeholder="제목을 입력하세요" aria-label="제목" autocomplete="off">
            <div class="body-tools">
              <button id="image-button" class="button" type="button" title="붙여넣기·끌어놓기도 돼요">이미지</button>
              <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
              <!-- 미리보기 접기·펴기: 동그라미 눈 버튼 (펼쳐져 있으면 초록 채움) -->
              <button id="preview-toggle" class="preview-toggle" type="button" aria-controls="preview-pane" aria-pressed="true" aria-label="미리보기 접기" title="미리보기 접기"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
            </div>
            <textarea id="body" class="body-input" placeholder="본문 (Markdown)" aria-label="본문 (Markdown)" spellcheck="false"></textarea>
          </div>
          <div class="write-foot">
            <p class="field-error" data-error-for="title"></p>
            <p class="field-error" data-error-for="body"></p>
            <span class="write-counts"><span class="count" data-count-for="title"></span><span class="count" data-count-for="body"></span></span>
          </div>
        </section>

        <!--
          오른쪽: 미리보기 (렌더러가 안전하게 만든 HTML만 들어감)
          넓은 화면은 나란히, 좁은 화면은 쓰기 칸 위를 덮는다. 열고 닫기는 #editor의 data-preview 값
        -->
        <section id="preview-pane" class="preview-pane" aria-label="미리보기">
          <p class="preview-label muted">미리보기</p>
          <h1 id="preview-title" class="preview-title"></h1>
          <article id="preview" class="preview"></article>
        </section>
      </div>

      <!-- 버튼 줄: 상태에 따라 post.js가 보이거나 숨긴다 -->
      <div class="actions">
        <div class="actions-left">
          <a class="button" href="/">← 목록</a>
          <button id="trash" class="button danger" type="button" hidden>휴지통</button>
        </div>
        <div class="actions-right">
          <button id="meta-button" class="button meta-button" type="button" aria-haspopup="dialog">글 정보<span id="meta-dot" class="meta-dot" hidden title="저장 안 한 변경이 있어요"></span></button>
          <button id="discard" class="button danger" type="button" hidden>수정본 버리기</button>
          <button id="unpublish" class="button" type="button" hidden>비공개로</button>
          <button id="save" class="button" type="button" title="Ctrl+S">저장</button>
          <button id="publish" class="button primary" type="button" hidden>공개하기</button>
          <button id="apply" class="button primary" type="button" hidden>수정본 반영</button>
        </div>
      </div>

      <!--
        글 정보 팝업 (설계 16-12): 대표 이미지 · 소개글 · 태그를 한 팝업에 세로로.
        칸은 편집 화면 값 그대로 (열 때 지금 값을 기억 → [취소]·Esc면 되돌림, [적용]은 닫기). 실제 저장은 아래 [저장]
      -->
      <dialog id="meta-dialog" class="meta-dialog" aria-labelledby="meta-title">
        <form method="dialog" class="meta-form">
          <div class="meta-head">
            <h2 id="meta-title">글 정보</h2>
            <button id="meta-close" class="meta-x" type="button" aria-label="닫기 (고친 것 버림)">×</button>
          </div>
          <div class="meta-body">
            <section class="meta-section" aria-labelledby="meta-thumb-title">
              <h3 id="meta-thumb-title">대표 이미지</h3>
              <div class="thumb-row">
                <div id="thumb-preview" class="thumb-preview"><span class="muted">기본 이미지</span></div>
                <div class="thumb-tools">
                  <div class="thumb-buttons">
                    <button id="thumb-upload" class="button" type="button">이미지 올리기</button>
                    <button id="thumb-pick" class="button" type="button" aria-expanded="false" aria-controls="thumb-choices">본문 이미지에서 고르기</button>
                    <button id="thumb-clear" class="button link-danger" type="button">빼기</button>
                    <input id="thumb-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
                  </div>
                  <input id="thumbnail" class="meta-input" type="text" placeholder="/images/… 또는 https://… (비우면 기본 이미지)" aria-label="대표 이미지 주소" autocomplete="off">
                  <div class="field-foot">
                    <p class="field-error" data-error-for="thumbnail"></p>
                    <span class="count" data-count-for="thumbnail"></span>
                  </div>
                </div>
              </div>
              <ul id="thumb-choices" class="thumb-choices" hidden></ul>
            </section>

            <section class="meta-section" aria-labelledby="meta-summary-title">
              <h3 id="meta-summary-title">소개글 <span class="muted meta-note">목록·검색엔진에 보여요</span></h3>
              <textarea id="summary" class="meta-input summary-input" rows="3" placeholder="목록에 보일 짧은 소개 (선택)" aria-labelledby="meta-summary-title"></textarea>
              <div class="field-foot">
                <p class="field-error" data-error-for="summary"></p>
                <span class="count" data-count-for="summary"></span>
              </div>
            </section>

            <section class="meta-section" aria-labelledby="meta-tags-title">
              <h3 id="meta-tags-title">태그</h3>
              <div id="tag-chips" class="tag-chips"></div>
              <input id="tag-search" class="meta-input" type="search" placeholder="찾기 · 없는 이름이면 Enter로 새 태그" aria-label="태그 찾기 또는 새 태그" autocomplete="off">
              <ul id="tag-tree" class="tag-pick-tree" aria-label="태그 고르기"></ul>
              <div class="field-foot">
                <p class="field-error" data-error-for="tags"></p>
                <span class="count" data-count-for="tags"></span>
              </div>
            </section>
          </div>
          <div class="meta-actions">
            <button id="meta-cancel" class="button" type="button">취소</button>
            <button id="meta-apply" class="button primary" type="button">적용</button>
          </div>
        </form>
      </dialog>
    </div>
  </main>
</body>
</html>
