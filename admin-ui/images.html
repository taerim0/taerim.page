<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이미지 · taerim.page 관리자</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="/assets/theme.js"></script>
  <script type="module" src="/assets/images.js"></script>
  <script type="module" src="/assets/deploy.js"></script>
</head>
<body>
  <!-- 안 쓰이는 이미지 정리 (설계 11-16): 글·작업본·번역·활동·설정 어디에도 안 쓰이고, 올린 지 24시간이 지난 것만 지울 수 있음 -->
  <header class="topbar">
    <!-- 머리글 (설계 16-11): 모든 관리자 화면이 같은 모양. 배포 상태·버튼은 deploy.js, 다크 버튼은 theme.js -->
    <div class="topbar-inner">
      <a class="brand" href="/">taerim.page <span class="brand-sub">admin</span></a>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <a href="/">글</a>
        <a href="/activities">활동</a>
        <a href="/tags">태그</a>
        <a href="/images" aria-current="page">이미지</a>
        <a href="/trash">휴지통</a>
        <a href="/settings">설정</a>
      </nav>
      <div class="topbar-tools">
        <span id="deploy-status" class="muted deploy-status"></span>
        <button id="deploy-button" class="button deploy-button" type="button" disabled title="공개 사이트에 반영해요 (GitHub Actions)">배포</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드" title="다크 모드"></button>
      </div>
    </div>
  </header>

  <main>
    <section class="filters">
      <div class="tabs" role="tablist" aria-label="보기">
        <button type="button" role="tab" data-view="unused">안 쓰임</button>
        <button type="button" role="tab" data-view="all">전체</button>
      </div>
      <p id="summary" class="muted">불러오는 중…</p>
    </section>
    <p class="muted image-help">글(휴지통 포함)·수정 중인 작업본·번역·활동·사이트 설정 사진에 쓰인 이미지는 지울 수 없어요. 올린 지 24시간이 안 된 것도요.</p>

    <ul id="image-grid" class="image-grid" aria-live="polite"></ul>

    <div class="actions image-actions">
      <button id="select-all" class="button" type="button" hidden>모두 고르기</button>
      <button id="delete" class="button danger" type="button" disabled hidden>지우기</button>
    </div>
  </main>
</body>
</html>
