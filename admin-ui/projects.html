<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>프로젝트 · taerim.page 관리자</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="/assets/theme.js"></script>
  <script type="module" src="/assets/projects.js"></script>
  <script type="module" src="/assets/deploy.js"></script>
</head>
<body>
  <!-- 프로젝트 (설계 18): 공개 사이트 /projects 카드. 저장 후 [배포]하면 반영. 화면 틀은 활동 화면과 같음 -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">taerim.page <span class="brand-sub">admin</span></a>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <a href="/">글</a>
        <a href="/activities">활동</a>
        <a href="/projects" aria-current="page">프로젝트</a>
        <a href="/tags">태그</a>
        <a href="/images">이미지</a>
        <a href="/trash">휴지통</a>
        <a href="/settings">설정</a>
      </nav>
      <div class="topbar-tools">
        <span id="deploy-status" class="muted deploy-status"></span>
        <button id="deploy-button" class="button deploy-button" type="button" disabled title="공개 사이트에 반영해요 (GitHub Actions)">배포</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드" title="다크 모드"></button>
      </div>
    </div>
  </header>

  <main>
    <p id="loading" class="muted">불러오는 중…</p>
    <div id="projects" class="activities-page" hidden>
      <!-- 왼쪽: 목록 (보이는 순서, ▲▼로 바꾸기) + 휴지통 -->
      <aside class="activity-side">
        <div class="activity-side-head">
          <h1 class="settings-heading">프로젝트</h1>
          <button id="new-project" class="button primary" type="button">+ 새 프로젝트</button>
        </div>
        <p class="muted activity-help">공개 사이트 /projects에 이 순서대로 카드로 보여요. 새 프로젝트는 맨 앞.</p>
        <ul id="project-list" class="activity-list project-list"></ul>
        <p id="project-empty" class="muted" hidden>아직 프로젝트가 없어요.</p>

        <details id="project-trash" class="project-trash" hidden>
          <summary>휴지통 <span id="trash-count" class="muted"></span></summary>
          <ul id="trash-list" class="project-trash-list"></ul>
        </details>
      </aside>

      <!-- 오른쪽: 쓰기 -->
      <form id="project-form" class="activity-form" novalidate>
        <p id="editing-label" class="muted">새 프로젝트</p>

        <div class="activity-row">
          <div class="field activity-title">
            <label for="title">이름</label>
            <input id="title" name="title" type="text" autocomplete="off" required>
            <div class="field-foot">
              <p class="field-error" data-error-for="title"></p>
              <span class="count" data-count-for="title"></span>
            </div>
          </div>
          <label class="project-visible"><input id="visible" type="checkbox" checked> 공개</label>
        </div>

        <div class="field">
          <label for="summary">한 줄 소개 (비워도 됨)</label>
          <input id="summary" name="summary" type="text" autocomplete="off">
          <div class="field-foot">
            <p class="field-error" data-error-for="summary"></p>
            <span class="count" data-count-for="summary"></span>
          </div>
        </div>

        <div class="activity-row">
          <div class="field">
            <label for="startedOn">시작한 달</label>
            <input id="startedOn" name="startedOn" type="month" required>
            <p class="field-error" data-error-for="startedOn"></p>
          </div>
          <div class="field">
            <label for="endedOn">끝난 달 (비우면 "~")</label>
            <input id="endedOn" name="endedOn" type="month">
            <p class="field-error" data-error-for="endedOn"></p>
          </div>
          <div class="field">
            <label for="status">상태</label>
            <select id="status" name="status">
              <option value="active">진행 중</option>
              <option value="done">끝남</option>
              <option value="paused">쉬는 중</option>
            </select>
            <p class="field-error" data-error-for="status"></p>
          </div>
        </div>

        <div class="activity-row">
          <div class="field activity-title">
            <label for="repoUrl">GitHub 주소 (비워도 됨)</label>
            <input id="repoUrl" name="repoUrl" type="url" autocomplete="off" placeholder="https://github.com/…">
            <p class="field-error" data-error-for="repoUrl"></p>
          </div>
          <div class="field activity-title">
            <label for="siteUrl">사이트 주소 (비워도 됨, 있으면 이름 링크)</label>
            <input id="siteUrl" name="siteUrl" type="url" autocomplete="off" placeholder="https://…">
            <p class="field-error" data-error-for="siteUrl"></p>
          </div>
        </div>

        <div class="field">
          <div class="activity-body-head">
            <label for="thumbnail">대표 이미지 (비우면 기본 그림, 카드에 가로:세로 3:1로 잘려 보여요)</label>
            <button id="thumb-button" class="button" type="button">이미지 올리기</button>
            <input id="thumb-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          </div>
          <input id="thumbnail" name="thumbnail" type="text" autocomplete="off" placeholder="/images/… 또는 https://…">
          <div class="project-thumb" id="thumb-preview" hidden><img id="thumb-img" alt=""></div>
          <p class="field-error" data-error-for="thumbnail"></p>
        </div>

        <div class="field">
          <label for="tag-input">태그 (글·노트와 같은 태그. Enter로 더하기, 칩을 누르면 빼기)</label>
          <div id="tag-chips" class="tag-chips"></div>
          <input id="tag-input" type="text" autocomplete="off" list="tag-options" placeholder="태그 이름 · Enter">
          <datalist id="tag-options"></datalist>
          <div class="field-foot">
            <p class="field-error" data-error-for="tags"></p>
            <span class="count" data-count-for="tags"></span>
          </div>
        </div>

        <!-- 본문은 따로 편집 화면에서 (설계 18-7): 글 편집과 같은 틀 -->
        <div class="field project-body-field">
          <span class="project-body-label">본문</span>
          <span id="body-state" class="muted"></span>
          <a id="body-link" class="button" hidden>본문 편집 →</a>
        </div>

        <div class="actions">
          <span id="saved-at" class="muted"></span>
          <span id="dirty-mark" class="dirty" hidden>저장 안 됨</span>
          <button id="delete" class="button danger" type="button" hidden>휴지통으로</button>
          <button id="save" class="button primary" type="submit">저장</button>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
