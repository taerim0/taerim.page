<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>휴지통 · taerim.page 관리자</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="/assets/theme.js"></script>
  <script type="module" src="/assets/trash.js"></script>
  <script type="module" src="/assets/deploy.js"></script>
</head>
<body>
  <header class="topbar">
    <!-- 머리글 (설계 16-11): 모든 관리자 화면이 같은 모양. 배포 상태·버튼은 deploy.js, 다크 버튼은 theme.js -->
    <div class="topbar-inner">
      <a class="brand" href="/">taerim.page <span class="brand-sub">admin</span></a>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <a href="/">글</a>
        <a href="/activities">활동</a>
        <a href="/tags">태그</a>
        <a href="/images">이미지</a>
        <a href="/trash" aria-current="page">휴지통</a>
        <a href="/settings">설정</a>
      </nav>
      <div class="topbar-tools">
        <span id="deploy-status" class="muted deploy-status"></span>
        <button id="deploy-button" class="button deploy-button" type="button" disabled title="공개 사이트에 반영해요 (GitHub Actions)">배포</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드" title="다크 모드"></button>
      </div>
    </div>
  </header>

  <main>
    <section class="filters">
      <p id="summary" class="muted">불러오는 중…</p>
      <!-- 되돌릴 수 없어서 누르면 가운데 팝업으로 한 번 더 확인 -->
      <button id="empty-trash" class="button danger" type="button" disabled>휴지통 비우기</button>
    </section>

    <!-- 휴지통 글은 편집 화면이 열리지 않아서 제목은 링크가 아님. 되살리면 항상 초안으로 돌아감 -->
    <ul id="trash-list" class="post-list" aria-live="polite"></ul>

    <nav id="pager" class="pager" aria-label="페이지"></nav>
  </main>
</body>
</html>
