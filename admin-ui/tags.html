<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>태그 · taerim.page 관리자</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="/assets/theme.js"></script>
  <script type="module" src="/assets/tags.js"></script>
  <script type="module" src="/assets/deploy.js"></script>
</head>
<body>
  <header class="topbar">
    <!-- 머리글 (설계 16-11): 모든 관리자 화면이 같은 모양. 배포 상태·버튼은 deploy.js, 다크 버튼은 theme.js -->
    <div class="topbar-inner">
      <a class="brand" href="/">taerim.page <span class="brand-sub">admin</span></a>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <a href="/">글</a>
        <a href="/activities">활동</a>
        <a href="/tags" aria-current="page">태그</a>
        <a href="/images">이미지</a>
        <a href="/trash">휴지통</a>
        <a href="/settings">설정</a>
      </nav>
      <div class="topbar-tools">
        <span id="deploy-status" class="muted deploy-status"></span>
        <button id="deploy-button" class="button deploy-button" type="button" disabled title="공개 사이트에 반영해요 (GitHub Actions)">배포</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드" title="다크 모드"></button>
      </div>
    </div>
  </header>

  <main>
    <section class="filters">
      <!-- 정렬: 화면에서만 바꾼다 (서버는 항상 이름순으로 준다) -->
      <div class="tabs" role="tablist" aria-label="정렬">
        <button type="button" role="tab" data-sort="name">이름순</button>
        <button type="button" role="tab" data-sort="count">글 많은 순</button>
      </div>
      <input id="tag-search" class="search-input" type="search" placeholder="태그 찾기" aria-label="태그 찾기" autocomplete="off">
    </section>

    <p id="summary" class="muted">불러오는 중…</p>
    <!-- 태그 칩: 누르면 그 태그로 거른 글 목록으로 -->
    <div id="tag-cloud" class="tag-cloud" aria-live="polite"></div>
  </main>
</body>
</html>
