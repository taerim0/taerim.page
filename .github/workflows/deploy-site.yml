# 공개 사이트(taerim.page) 빌드·배포
# - 관리자 [배포] 버튼: 관리자 Worker가 GitHub API로 이 워크플로를 실행 (workflow_dispatch)
# - main에 사이트 관련 코드가 바뀌면 자동
# - 매일 04:00 (한국): 조회수 모으기(Web Analytics → D1, 설계 2-2) 후 다시 빌드 → 글 페이지 숫자가 하루 한 번 바뀜
# 원격 D1의 공개 글을 읽어 정적 파일을 만들고(dist/site), 코드 없는 정적 파일 Worker로 배포한다
name: 공개 사이트 배포

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 한국 04:00
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "site-static/**"
      - "wrangler.site.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-site.yml"

# 배포가 겹치지 않게 하나씩. 진행 중인 배포는 끝까지 두고, 기다리는 요청은 가장 최근 것 하나만 남는다
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 저장소 시크릿 (Settings > Secrets and variables > Actions)
      # 토큰 권한: Workers 편집(Edit Cloudflare Workers 템플릿) + D1 편집(조회수 저장) + R2 읽기
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 조회수 읽기 전용 (Account Analytics 읽기). 없으면 모으기 단계를 건너뜀
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 테스트 파일은 저장소에 없어서(로컬 전용) 타입 검사만
      - run: npm run typecheck
      # 실패해도 빌드는 계속 (지난 숫자로). 최근 3일을 덮어쓰므로 다음 날 채워짐
      - name: 조회수 모으기 (Web Analytics → 원격 D1)
        if: env.CLOUDFLARE_ANALYTICS_TOKEN != ''
        continue-on-error: true
        run: node scripts/collect-views.ts --remote
      - name: 빌드 (원격 D1 → dist/site)
        run: npm run build:site -- --remote
        env:
          # 통계 잔디의 GitHub 기여 (설계 15-9). Actions가 원래 주는 토큰 — 새 비밀값 없음, 공개 기여만
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 배포 (taerim.page)
        run: npx wrangler deploy -c wrangler.site.jsonc
