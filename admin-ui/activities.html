<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>활동 · taerim.page 관리자</title>
  <link rel="stylesheet" href="/assets/admin.css">
  <script src="/assets/theme.js"></script>
  <script type="module" src="/assets/activities.js"></script>
  <script type="module" src="/assets/deploy.js"></script>
</head>
<body>
  <!-- 활동 (설계 15-5, 15-8, 예전 이름 이슈): 아카이브·홈에 보이는 짧은 기록. 저장 후 [배포]하면 공개 사이트에 반영 -->
  <header class="topbar">
    <!-- 머리글 (설계 16-11): 모든 관리자 화면이 같은 모양. 배포 상태·버튼은 deploy.js, 다크 버튼은 theme.js -->
    <div class="topbar-inner">
      <a class="brand" href="/">taerim.page <span class="brand-sub">admin</span></a>
      <nav class="admin-nav" aria-label="관리자 메뉴">
        <a href="/">글</a>
        <a href="/activities" aria-current="page">활동</a>
        <a href="/tags">태그</a>
        <a href="/images">이미지</a>
        <a href="/trash">휴지통</a>
        <a href="/settings">설정</a>
      </nav>
      <div class="topbar-tools">
        <span id="deploy-status" class="muted deploy-status"></span>
        <button id="deploy-button" class="button deploy-button" type="button" disabled title="공개 사이트에 반영해요 (GitHub Actions)">배포</button>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="다크 모드" title="다크 모드"></button>
      </div>
    </div>
  </header>

  <main>
    <p id="loading" class="muted">불러오는 중…</p>
    <div id="activities" class="activities-page" hidden>
      <!-- 왼쪽: 목록 -->
      <aside class="activity-side">
        <div class="activity-side-head">
          <h1 class="settings-heading">활동</h1>
          <button id="new-activity" class="button primary" type="button">+ 새 활동</button>
        </div>
        <p class="muted activity-help">아카이브에 글과 함께, 홈에는 최근 10개가 보여요. 자기 페이지는 없어요.</p>
        <ul id="activity-list" class="activity-list"></ul>
        <p id="activity-empty" class="muted" hidden>아직 활동이 없어요.</p>
      </aside>

      <!-- 오른쪽: 쓰기 -->
      <form id="activity-form" class="activity-form" novalidate>
        <p id="editing-label" class="muted">새 활동</p>
        <div class="activity-row">
          <div class="field activity-date">
            <label for="date">날짜</label>
            <input id="date" name="date" type="date" required>
            <p class="field-error" data-error-for="date"></p>
          </div>
          <div class="field activity-label">
            <label for="label">꼬리표 (비우면 "활동")</label>
            <input id="label" name="label" type="text" autocomplete="off" list="label-options" placeholder="활동">
            <div class="field-foot">
              <p class="field-error" data-error-for="label"></p>
              <span class="count" data-count-for="label"></span>
            </div>
          </div>
          <div class="field activity-title">
            <label for="title">제목</label>
            <input id="title" name="title" type="text" autocomplete="off" required>
            <div class="field-foot">
              <p class="field-error" data-error-for="title"></p>
              <span class="count" data-count-for="title"></span>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="activity-body-head">
            <label for="body">내용 (Markdown, 비워도 됨)</label>
            <button id="image-button" class="button" type="button">이미지</button>
            <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
          </div>
          <textarea id="body" name="body" class="activity-body-input" spellcheck="false"></textarea>
          <div class="field-foot">
            <p class="field-error" data-error-for="body"></p>
            <span class="count" data-count-for="body"></span>
          </div>
        </div>

        <section class="activity-preview" aria-label="미리보기">
          <p class="muted">미리보기 (아카이브에 이렇게 보여요. 공개 사이트에서는 내용이 접힌 채로 시작해요)</p>
          <div class="activity-preview-box">
            <p class="activity-preview-title"><span id="preview-label" class="activity-badge">활동</span> <span id="preview-title"></span></p>
            <article id="preview" class="preview"></article>
          </div>
        </section>

        <details id="english" class="activity-english">
          <summary>영어 (선택, 비우면 영어 페이지에도 한국어)</summary>
          <div class="field">
            <label for="labelEn">꼬리표 (영어, 비우면 한국어 꼬리표 → 그것도 없으면 "Activity")</label>
            <input id="labelEn" name="labelEn" type="text" autocomplete="off" lang="en" list="label-en-options">
            <div class="field-foot">
              <p class="field-error" data-error-for="labelEn"></p>
              <span class="count" data-count-for="labelEn"></span>
            </div>
          </div>
          <div class="field">
            <label for="titleEn">제목 (영어)</label>
            <input id="titleEn" name="titleEn" type="text" autocomplete="off" lang="en">
            <div class="field-foot">
              <p class="field-error" data-error-for="titleEn"></p>
              <span class="count" data-count-for="titleEn"></span>
            </div>
          </div>
          <div class="field">
            <label for="bodyEn">내용 (영어)</label>
            <textarea id="bodyEn" name="bodyEn" class="activity-body-input" spellcheck="false" lang="en"></textarea>
            <div class="field-foot">
              <p class="field-error" data-error-for="bodyEn"></p>
              <span class="count" data-count-for="bodyEn"></span>
            </div>
          </div>
        </details>

        <div class="actions">
          <span id="saved-at" class="muted"></span>
          <span id="dirty-mark" class="dirty" hidden>저장 안 됨</span>
          <button id="delete" class="button danger" type="button" hidden>지우기</button>
          <button id="save" class="button primary" type="submit">저장</button>
        </div>
        <!-- 이미 쓴 꼬리표 고르기 (activities.js가 채움) -->
        <datalist id="label-options"></datalist>
        <datalist id="label-en-options"></datalist>
      </form>
    </div>
  </main>
</body>
</html>
